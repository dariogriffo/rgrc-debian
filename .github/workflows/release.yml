name: Build rgrc for Debian

on:
  workflow_dispatch:
    inputs:
      rgrc_version:
        description: The version of rgrc to build.
        type: string
        required: true
      build_version:
        description: The build version.
        type: string
        required: true
      architecture:
        description: Architecture to build (amd64, arm64, armhf, i386, or 'all' for all architectures)
        type: choice
        default: 'all'
        options:
          - 'all'
          - 'amd64'
          - 'arm64'
          - 'armhf'
          - 'i386'

permissions:
  contents: write

jobs:
  build-rgrc:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout rgrc-debian
        uses: actions/checkout@v4

      - name: Validate upstream license permits paid distribution
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./validate_license.sh ${{ inputs.rgrc_version }}

      - name: Build rgrc
        run: ./build.sh ${{ inputs.rgrc_version }} ${{ inputs.build_version }} ${{ inputs.architecture }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: artifact
          path: rgrc_*.deb

  build-src:
    name: Build Source Packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout rgrc-debian
        uses: actions/checkout@v4

      - name: Install dpkg-dev
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends dpkg-dev devscripts wget ca-certificates

      - name: Build source packages
        run: ./build_src.sh ${{ inputs.rgrc_version }} ${{ inputs.build_version }}

      - name: Upload Source Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: source-artifact
          path: |
            rgrc_*.dsc
            rgrc_*.orig.tar.gz
            rgrc_*.debian.tar.xz

  release-rgrc:
    name: Release rgrc for Debian
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [build-rgrc, build-src]
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          name: artifact

      - name: Download Source Artifacts
        uses: actions/download-artifact@v4
        with:
          name: source-artifact

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          files: |
            rgrc_*.deb
            rgrc_*.dsc
            rgrc_*.orig.tar.gz
            rgrc_*.debian.tar.xz
          name: ${{ inputs.rgrc_version }}+${{ inputs.build_version }}
          tag_name: ${{ inputs.rgrc_version }}+${{ inputs.build_version }}
          fail_on_unmatched_files: true
